# Coolify Compose deployment for the Zoom17 full-stack app.
#
# Routing: Coolify attaches its own proxy network and generates Traefik labels,
# so no external network is declared here. The `web` service (nginx) publishes
# SERVICE_FQDN_WEB_80 — Coolify fills that in with the domain you assign to the
# service, and routes it to container port 80.
#
# Secrets: set JWT_SECRET and TURN_SECRET (and, for LiveKit, LIVEKIT_*) in the
# Coolify UI → Environment tab. Both must be long random strings.
#
# nginx serves the built front-end and proxies /api and /ws to the `server`
# service over the private `internal` network.
#
# LiveKit (optional SFU): the `livekit` service provides scalable video. When the
# server's LIVEKIT_URL/API_KEY/API_SECRET are set, meetings use it; otherwise the
# app automatically falls back to peer-to-peer mesh video (no LiveKit required).

services:
  server:
    build:
      context: ./server
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_DAYS=${SESSION_DAYS:-7}
      - DB_PATH=/data/app.db
      # Same-origin in this layout (nginx proxies /api and /ws), so the default
      # is safe. Override only if you serve the API from another hostname.
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # No default host here on purpose: a stale TURN address is worse than none,
      # because calls sit on "connecting" instead of failing fast. Set this to
      # your own coturn host, e.g.
      #   TURN_URLS=turn:turn.example.com:3478,turns:turn.example.com:5349
      - TURN_URLS=${TURN_URLS:-}
      - TURN_SECRET=${TURN_SECRET:-${JWT_SECRET}}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - AI_TRANSCRIPTION_URL=${AI_TRANSCRIPTION_URL:-http://speaches:8000}
      - AI_TRANSCRIPTION_MODEL=${AI_TRANSCRIPTION_MODEL:-Systran/faster-whisper-small}
      - AI_SUMMARY_URL=${AI_SUMMARY_URL:-}
      - AI_SUMMARY_MODEL=${AI_SUMMARY_MODEL:-qwen2.5:3b}
    volumes:
      - db-data:/data
    networks:
      - internal
    restart: unless-stopped

  web:
    build:
      context: .
    environment:
      # Coolify magic variable: declared with no value, it is populated with the
      # domain assigned to this service and wires up the proxy to port 80.
      - SERVICE_FQDN_WEB_80
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - internal
    restart: unless-stopped

  # --- TURN relay (coturn) ---
  # Mesh video needs this the moment two people are on different networks. STUN
  # only discovers a public address; when either side is behind a symmetric NAT
  # or a firewall that blocks UDP, the call completes signalling and then sits on
  # "connecting" forever because there is no path for the media.
  #
  # Port 5349 (TLS) matters: it is the one that survives restrictive networks
  # which block plain UDP. The server mints short-lived credentials from the
  # shared secret, so nothing long-lived is handed to the browser.
  turn:
    image: coturn/coturn:4.6
    network_mode: host        # coturn needs the real client IP and a UDP port range
    command: >
      -n --log-file=stdout
      --realm=${TURN_REALM:-zoom17}
      --use-auth-secret --static-auth-secret=${TURN_SECRET:-${JWT_SECRET}}
      --min-port=49160 --max-port=49200
      --no-cli --no-tlsv1 --no-tlsv1_1
      --external-ip=$$(detect-external-ip)
    restart: unless-stopped

  # OpenAI-compatible, self-hosted speech-to-text. The model is downloaded on
  # first use and cached in this volume. AI_TRANSCRIPTION_URL already points at
  # http://speaches:8000, so the AI Notes buttons work with no extra config.
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    volumes:
      - ai-models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - internal
    restart: unless-stopped

  # --- LiveKit SFU (enable once LIVEKIT_KEYS is set in the Environment tab) ---
  # Uncomment this service AFTER setting LIVEKIT_KEYS, then redeploy. Also assign
  # a domain to service "livekit" on port 7880 (HTTPS/wss), and set
  # LIVEKIT_URL/LIVEKIT_API_KEY/LIVEKIT_API_SECRET so the server mints tokens.
  # Until then the app uses peer-to-peer mesh video automatically.
  # livekit:
  #   image: livekit/livekit-server:v1.8
  #   command: --config /etc/livekit/livekit.yaml
  #   volumes:
  #     - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
  #   environment:
  #     - SERVICE_FQDN_LIVEKIT_7880
  #     - LIVEKIT_KEYS=${LIVEKIT_KEYS:-}
  #   ports:
  #     - "7881:7881"        # RTC over TCP (fallback)
  #     - "7882:7882/udp"    # RTC over UDP (muxed)
  #   networks:
  #     - internal
  #   restart: unless-stopped

networks:
  internal:

volumes:
  db-data:
  ai-models:
