# LiveKit SFU server config. API keys are injected via the LIVEKIT_KEYS env var
# (set in Dokploy → Environment) so no secret lives in the repo.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  # single UDP port muxing keeps the required open ports small
logging:
  level: info
  json: false
